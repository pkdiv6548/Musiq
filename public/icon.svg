<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="musiq-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2d55" />
      <stop offset="50%" stop-color="#ff375f" />
      <stop offset="100%" stop-color="#ff007a" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161822" />
      <stop offset="100%" stop-color="#0b0c10" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255, 45, 85, 0.25)" stroke-width="6" />

  <!-- Neon audio equalizer / musical frequency wave lines -->
  <g filter="url(#glow)" fill="url(#musiq-grad)">
    <!-- Equalizer bars forming the letter 'M' and audio wave -->
    <rect x="110" y="190" width="34" height="132" rx="17" />
    <rect x="160" y="140" width="34" height="232" rx="17" />
    <rect x="210" y="210" width="34" height="92" rx="17" />
    <rect x="268" y="210" width="34" height="92" rx="17" />
    <rect x="318" y="140" width="34" height="232" rx="17" />
    <rect x="368" y="190" width="34" height="132" rx="17" />
  </g>

  <!-- Floating accent dots -->
  <circle cx="127" cy="150" r="10" fill="#ff2d55" opacity="0.8" />
  <circle cx="256" cy="165" r="12" fill="#ffffff" opacity="0.9" />
  <circle cx="385" cy="150" r="10" fill="#ff2d55" opacity="0.8" />
</svg>
